<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae | Hammam Ibnu Adi Abdillah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap');
        body { background-color: #12151c; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        h1 { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <!-- Bar Navigasi Atas -->
    <header class="bg-[#181c26] border-b border-[#2e3545] px-6 py-4 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <a href="index.html" class="inline-flex items-center gap-2 text-[#60a5fa] hover:text-white transition text-sm font-medium">
                <i class="fa-solid fa-arrow-left"></i> Back to Portfolio
            </a>
            
            <div class="flex items-center gap-3">
                <a href="CV Hammam.pdf" download="CV_Hammam_Ibnu_Adi_Abdillah.pdf" class="inline-flex items-center gap-2 bg-[#2563eb] hover:bg-blue-600 text-white px-5 py-2.5 rounded-full text-sm font-medium transition shadow-lg">
                    <i class="fa-solid fa-download"></i> Download CV (PDF)
                </a>
            </div>
        </div>
    </header>

    <!-- Area Pratinjau Dokumen CV -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-8 flex flex-col">
        <div class="mb-4 flex items-center justify-between">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-white">Curriculum Vitae</h1>
                <p class="text-xs md:text-sm text-[#94a3b8]">Hammam Ibnu Adi Abdillah — Informatics Student at UNS</p>
            </div>
            <!-- Tautan cadangan jika dibuka dari browser HP yang tidak mendukung iframe PDF -->
            <a href="CV Hammam.pdf" target="_blank" class="text-xs text-[#60a5fa] hover:underline md:hidden">
                Open Fullscreen <i class="fa-solid fa-up-right-from-square ml-1"></i>
            </a>
        </div>

        <!-- Bingkai Pratinjau PDF -->
        <div class="w-full h-[78vh] bg-[#1f2430] rounded-2xl border border-[#2e3545] overflow-hidden shadow-2xl">
            <iframe src="CV Hammam.pdf#toolbar=0" class="w-full h-full border-0" title="CV Hammam Ibnu Adi Abdillah">
                <p class="p-6 text-sm text-[#94a3b8]">
                    Browser Anda tidak mendukung pratinjau PDF secara langsung. 
                    <a href="CV Hammam.pdf" class="text-[#60a5fa] underline">Klik di sini untuk melihat atau mengunduh CV</a>.
                </p>
            </iframe>
        </div>
    </main>
</body>
</html>
